<style>
        html { font-size: 10px; }
        body { font-size: 1.6rem; }
        
        .bg-tech-pattern {
            background-color: theme('colors.surface-dim');
            background-image: radial-gradient(circle at 50% 0%, theme('colors.surface-container-high') 0%, transparent 70%),
                              linear-gradient(0deg, rgba(5, 20, 36, 0.9) 0%, rgba(5, 20, 36, 0.4) 100%);
            background-size: cover;
            background-position: center;
        }

        .card {
            background-color: theme('colors.surface-container-high');
            border-radius: 1.2rem;
            border: 1px solid rgba(148, 163, 184, 0.1);
        }

        .button--primary {
            background-color: theme('colors.primary-container');
            color: theme('colors.on-primary-container');
            font-weight: 700;
            transition: all 0.2s ease-in-out;
        }

        .button--primary:hover {
            box-shadow: 0 0 15px rgba(0, 255, 157, 0.2);
            transform: translateY(-1px);
        }

        .button--secondary {
            border: 1px solid theme('colors.primary-container');
            color: theme('colors.primary-container');
            background: transparent;
            transition: all 0.2s ease-in-out;
        }

        .button--secondary:hover {
            background: rgba(0, 255, 157, 0.1);
            box-shadow: 0 0 15px rgba(0, 255, 157, 0.1);
        }

        .input__field {
            background-color: theme('colors.surface-container-highest');
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: theme('colors.on-surface');
            transition: all 0.2s ease-in-out;
        }

        .input__field:focus {
            outline: none;
            border-color: theme('colors.primary-container');
            box-shadow: 0 0 10px rgba(0, 255, 157, 0.2);
        }
      </style>
</head>
<body class="bg-tech-pattern min-h-screen text-on-surface font-body-md flex items-center justify-center p-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<main class="w-full max-w-md relative z-10">
<div class="text-center mb-xl">
<h1 class="font-headline-xl text-headline-xl text-primary-container tracking-tight drop-shadow-md">GamerPulse</h1>
<p class="font-label-md text-label-md text-on-surface-variant mt-sm uppercase tracking-widest">System Access Portal</p>
</div>
<div class="card p-xl shadow-2xl relative overflow-hidden group">
<div class="flex border-b border-surface-container-highest mb-lg">
<button class="flex-1 pb-md font-label-md text-label-md text-primary-container border-b-2 border-primary-container relative">
                    Iniciar Sesión
                    <div class="absolute bottom-0 left-0 w-full h-[2px] bg-primary-container shadow-[0_0_10px_rgba(0,255,157,0.5)]"></div>
</button>
<button class="flex-1 pb-md font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors">
                    Registrarse
                </button>
</div>
<form action="#" class="space-y-lg" method="POST">
<div class="space-y-xs relative">
<label class="font-label-sm text-label-sm text-on-surface-variant block" for="email">Correo Electrónico</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" style="font-variation-settings: 'FILL' 1;">mail</span>
<input class="input__field w-full rounded-lg py-md pl-[4.8rem] pr-md font-body-md text-body-md placeholder-on-surface-variant/50 focus:ring-0" id="email" name="email" placeholder="admin@gamerpulse.com" required="" type="email"/>
</div>
</div>
<div class="space-y-xs relative">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface-variant block" for="password">Contraseña</label>
<a class="font-label-sm text-label-sm text-primary-container hover:underline hover:text-primary-fixed" href="#">¿Olvidaste tu contraseña?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" style="font-variation-settings: 'FILL' 1;">lock</span>
<input class="input__field w-full rounded-lg py-md pl-[4.8rem] pr-md font-body-md text-body-md placeholder-on-surface-variant/50 focus:ring-0" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<div class="pt-sm">
<button class="button--primary w-full rounded-lg py-md font-label-md text-label-md flex items-center justify-center gap-sm" type="submit">
<span class="material-symbols-outlined">login</span>
                        Autenticar
                    </button>
</div>
</form>
<div class="mt-xl relative">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-surface-container-highest"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-md bg-surface-container-high text-on-surface-variant font-label-sm text-label-sm">O continuar con</span>
</div>
</div>
<div class="mt-lg">
<button class="button--secondary w-full rounded-lg py-md font-label-md text-label-md flex items-center justify-center gap-sm" type="button">
<span class="material-symbols-outlined">sports_esports</span>
                    Conectar vía Steam
                </button>
</div>
<div class="absolute -bottom-10 -right-10 w-40 h-40 bg-primary-container/5 rounded-full blur-3xl pointer-events-none"></div>
</div>
</main>
<div class="fixed top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary-container to-transparent opacity-20"></div>
</body></html>
