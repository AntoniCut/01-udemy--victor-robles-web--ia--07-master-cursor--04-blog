    Q 366 188 366 236
    L 372 320
    Q 376 366 336 372
    Q 306 376 288 344
    L 278 326
    Q 268 310 256 310
    Q 244 310 234 326
    L 224 344
    Q 206 376 176 372
    Q 136 366 140 320
    Z"
    fill="url(#controllerShine)"/>

  <!-- Cruceta (D-pad) -->
  <rect x="184" y="230" width="20" height="60" rx="5" fill="#4F46E5"/>
  <rect x="164" y="250" width="60" height="20" rx="5" fill="#4F46E5"/>

  <!-- Botones -->
  <circle cx="320" cy="238" r="12" fill="#7C3AED"/>
  <circle cx="348" cy="266" r="12" fill="#7C3AED"/>
  <circle cx="292" cy="266" r="12" fill="#4F46E5"/>
  <circle cx="320" cy="294" r="12" fill="#4F46E5"/>

  <!-- Pixel accent (identidad "gaming/retro") -->
